[project]
name = "tle-engine"
version = "0.1.0"
description = "Pure deterministic simulation: primitives, state, systems, engines, loop (no I/O)"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.6"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tle"]
