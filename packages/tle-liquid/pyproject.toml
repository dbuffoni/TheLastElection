[project]
name = "tle-liquid"
version = "0.1.0"
description = "Local/remote inference engine for the Liquid AI models behind S1 (d1 decision model) and S2 (LFM instruct): batched, CUDA / ROCm / CPU, OpenAI-compatible server"
requires-python = ">=3.12"
# The package never imports the game. Light dependencies only: torch is installed by scripts/install.sh because the right
# wheel depends on the GPU vendor (CUDA / ROCm / CPU) and cannot be chosen in this file.
dependencies = []

[project.optional-dependencies]
serve = [
    "transformers>=5.19",
    "huggingface_hub>=0.30",
    "accelerate>=1.0",
    "xgrammar>=0.1.20",
    "starlette>=0.40",
    "uvicorn>=0.30",
]

[project.scripts]
tle-liquid = "tle.liquid.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tle"]
