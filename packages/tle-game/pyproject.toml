[project]
name = "tle-game"
version = "0.1.0"
description = "Text game client (turn packages only)"
requires-python = ">=3.12"
dependencies = [
    "tle-engine",
    "tle-config",
    "tle-store",
    "rich>=13"
]

[tool.uv.sources]
tle-engine = { workspace = true }
tle-config = { workspace = true }
tle-store = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tle"]
