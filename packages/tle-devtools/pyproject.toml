[project]
name = "tle-devtools"
version = "0.1.0"
description = "Agent tooling: boundary checks, harness check, debugging"
requires-python = ">=3.12"
dependencies = [
    "tle-engine",
    "tle-config",
    "tle-store",
    "tle-lab"
]

[tool.uv.sources]
tle-engine = { workspace = true }
tle-config = { workspace = true }
tle-store = { workspace = true }
tle-lab = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tle"]
