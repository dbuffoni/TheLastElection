[project]
name = "tle-config"
version = "0.1.0"
description = "Registries, catalogs, profiles, manifests, codegen"
requires-python = ">=3.12"
dependencies = [
    "tle-engine",
    "pydantic>=2.6",
    "tomli-w>=1.0"
]

[tool.uv.sources]
tle-engine = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tle"]
