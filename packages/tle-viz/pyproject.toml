[project]
name = "tle-viz"
version = "0.1.0"
description = "Renderers shared by the dashboard and the PNG export (charts, matrices) drawn from result objects"
requires-python = ">=3.12"
dependencies = ["tle-config", "tle-store", "tle-lab", "polars", "bokeh>=3.4"]

[tool.uv.sources]
tle-config = { workspace = true }
tle-store = { workspace = true }
tle-lab = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tle"]
