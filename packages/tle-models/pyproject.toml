[project]
name = "tle-models"
version = "0.1.0"
description = "Real/cached engines, model backends, prompts, response cache"
requires-python = ">=3.12"
dependencies = [
    "tle-engine",
    "tle-config"
]

[project.optional-dependencies]
local = ["torch", "transformers", "bitsandbytes", "outlines"]
remote = ["openai>=1.0"]

[tool.uv.sources]
tle-engine = { workspace = true }
tle-config = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tle"]
