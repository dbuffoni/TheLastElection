[project]
name = "tle-testing"
version = "0.1.0"
description = "Test support: injectors, toy models, strategies, fixtures"
requires-python = ">=3.12"
dependencies = [
    "tle-engine",
    "tle-config",
    "tle-store",
    "tle-lab",
    "hypothesis>=6"
]

[tool.uv.sources]
tle-engine = { workspace = true }
tle-config = { workspace = true }
tle-store = { workspace = true }
tle-lab = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tle"]
