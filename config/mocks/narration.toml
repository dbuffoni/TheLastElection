faction_appeal = ["{actor} appeals to the courts", "{actor} asks the judges to step in"]
statement = ["{actor} makes a statement on the mayor", "{actor} speaks out in the square"]
article = ["{actor} publishes a sharp article", "{actor} writes about the town hall"]
lawsuit = ["{actor} files a lawsuit against the mayor", "{actor} takes the mayor to court"]
