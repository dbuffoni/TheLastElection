strike = ["{actor} stops work", "{actor} walks out"]
lockout = ["{actor} shuts the doors of their shops", "{actor} locks out the workers"]
donation = ["{actor} donates to the town", "{actor} funds a public work"]
elite_petition = ["{actor} petition the mayor in private", "{actor} send a letter to the town hall"]
class_assembly = ["{actor} gather in assembly", "{actor} hold a meeting to decide what to do"]
investigation = ["{actor} opens an investigation", "{actor} starts looking into the town hall"]
ruling = ["{actor} hands down a ruling", "{actor} rules on a disputed case"]
civic_mobilization = ["{actor} mobilize to defend the town's institutions", "{actor} organise a civic vigil"]
