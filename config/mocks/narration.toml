decree_property = ["{actor} decrees on land, trade and licences", "{actor} changes the rules of the market"]
decree_civil = ["{actor} decrees on order and the streets", "{actor} sets new limits for public life"]
decree_economy = ["{actor} announces measures for the economy", "{actor} opens the purse of the town"]
decree_culture = ["{actor} decrees on feasts and traditions", "{actor} speaks to the town's customs"]
decree_security = ["{actor} announces measures on security", "{actor} orders the guard to act"]
decree_announce = ["{actor} addresses the town", "{actor} makes an announcement from the town hall"]
demonstration = ["{actor} fills the square with a demonstration", "{actor} marches to the town hall"]
petition = ["{actor} hands in a petition", "{actor} gathers signatures for the mayor"]
fundraising = ["{actor} raises funds for its cause", "{actor} holds a charity dinner"]
