[tone]
# by intensity index 0..6
body = [
  "A quiet matter that few notice.",
  "A small affair, talked about in a few homes.",
  "It draws some attention in the market.",
  "People discuss it in the square.",
  "It splits opinion across the town.",
  "It dominates conversation everywhere.",
  "Nobody in town can ignore it.",
]

[reactions]
# stance index 0 (opposition) .. 6 (adherence)
"0" = ["Fight it openly", "Refuse to comply and say so", "Call on the neighbours to resist"]
"1" = ["Object loudly", "Write to the council to complain", "Speak against it at the market"]
"2" = ["Grumble but go along", "Voice doubts to friends", "Keep a wary distance"]
"3" = ["Shrug and carry on", "Stay out of it", "Wait to see what happens"]
"4" = ["Nod in approval", "Say a good word for it", "See some good in it"]
"5" = ["Back it openly", "Speak up in its favor", "Encourage the neighbours to support it"]
"6" = ["Join the movement", "Throw in with it for good", "Sign up and organise"]
