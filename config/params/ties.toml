# Parameter registry: group 'ties'. One table per hyperparameter (see docs/parameters.md).

[g_w]
symbol      = "g_w"
spec        = "8.2"
description = "Tie gain per shared event"
default     = 0.15
range       = [0.05, 0.4]
scale       = "linear"
class       = "free"
stage       = 1
introduced  = 3
module      = "systems.ties"
status      = "provisional"
rationale   = "From 0.1 to 0.5 in 4-5 shared events"

[w_0]
symbol      = "w_0"
spec        = "8.2"
description = "Initial intensity of a new tie"
default     = 0.1
scale       = "linear"
class       = "fixed"
stage       = 0
introduced  = 3
module      = "systems.ties"
status      = "provisional"
rationale   = "An encounter is weak"

[w_fam]
symbol      = "w_fam"
spec        = "8.2"
description = "Initial intensity of a family tie"
default     = 0.8
scale       = "linear"
class       = "fixed"
stage       = 0
introduced  = 3
module      = "systems.ties"
status      = "provisional"
rationale   = "Strong but not maximal"

[theta_stab_in]
symbol      = "θ_stab,in"
spec        = "8.2"
description = "Tie stabilization threshold"
default     = 0.4
range       = [0.25, 0.6]
scale       = "linear"
class       = "free"
stage       = 1
introduced  = 3
module      = "systems.ties"
status      = "provisional"
rationale   = "Three shared events from w_0"

[theta_stab_out]
symbol      = "θ_stab,out"
spec        = "8.2"
description = "Tie destabilization threshold"
default     = 0.25
scale       = "linear"
class       = "derived"
stage       = 0
introduced  = 3
module      = "systems.ties"
status      = "provisional"
formula     = "0.625 * theta_stab_in"
rationale   = "Hysteresis"

[G_w]
symbol      = "G_w"
spec        = "8.2"
description = "Grace before tie decay (days)"
default     = 45.0
range       = [15, 120]
scale       = "linear"
class       = "free"
stage       = 1
introduced  = 3
module      = "systems.ties"
status      = "provisional"
rationale   = "Six cadences without contact"

[h_w]
symbol      = "h_w"
spec        = "8.2"
description = "Half-life of tie intensity for inactivity (days)"
default     = 60.0
range       = [20, 200]
scale       = "log"
class       = "free"
stage       = 1
introduced  = 3
module      = "systems.ties"
status      = "provisional"

[theta_w_out]
symbol      = "θ_w,out"
spec        = "8.2"
description = "Exit from the network"
default     = 0.15
scale       = "linear"
class       = "fixed"
stage       = 0
introduced  = 3
module      = "systems.ties"
status      = "provisional"
rationale   = "Just above the value of a new tie"

[B_bond]
symbol      = "B_bond"
spec        = "8.2"
description = "Involved count beyond which event ties form only within a circle"
