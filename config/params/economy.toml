# Parameter registry: group 'economy'. One table per hyperparameter (see docs/parameters.md).

[eta_tr]
symbol      = "η_tr"
spec        = "8.3"
description = "Maximum levy of a one-off transfer"
default     = 0.2
range       = [0.05, 0.4]
scale       = "linear"
class       = "free"
stage       = 4
introduced  = 11
module      = "systems.economy"
status      = "provisional"
rationale   = "A maximum extraordinary tax takes a fifth of the wealth"

