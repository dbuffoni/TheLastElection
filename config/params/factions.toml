[theta_m_in]
symbol      = "θ_m,in"
spec        = "8.2"
description = "Membership entry threshold"
default     = 0.3
scale       = "linear"
class       = "fixed"
stage       = 0
introduced  = 8
module      = "systems.factions"
status      = "provisional"

[theta_m_out]
symbol      = "θ_m,out"
spec        = "8.2"
description = "Membership exit threshold"
default     = 0.15
scale       = "linear"
class       = "derived"
stage       = 0
introduced  = 8
module      = "systems.factions"
status      = "provisional"
formula     = "0.5 * theta_m_in"
