# Parameter registry: group 'influencers'. One table per hyperparameter (see docs/parameters.md).

[theta_z]
symbol      = "θ_z"
spec        = "8.2"
description = "Influencer potential entry threshold"
default     = 0.7
range       = [0.5, 0.9]
scale       = "linear"
class       = "free"
stage       = 3
introduced  = 9
module      = "systems.influencers"
status      = "provisional"
rationale   = "The most central and polarized 5-10%"

