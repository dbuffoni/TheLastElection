# Parameter registry: group 'threats'. One table per hyperparameter (see docs/parameters.md).

[x_star_T]
symbol      = "x*_T"
spec        = "8.3"
description = "Equilibrium threat pressure at full inflow"
default     = 0.66
range       = [0.4, 0.9]
scale       = "linear"
class       = "free"
stage       = 4
introduced  = 12
module      = "systems.threats"
status      = "provisional"

[g_T]
symbol      = "g_T"
spec        = "8.3"
description = "Threat pressure income (derived)"
default     = 0.03
scale       = "linear"
class       = "derived"
stage       = 0
introduced  = 12
module      = "systems.threats"
status      = "provisional"
formula     = "income_for_equilibrium(h_pT, x_star_T)"

