# S1 = Jev (TypeSafe's decision model, a pure classifier) and S2 = a small open narrator, both on OpenRouter,
# configured from environment variables (see .env.example).
# Use: uv run tle run --engines config/engines.openrouter.toml --n 60 --cache runs/cache.jsonl
# For a small open LLM as S1 instead of Jev: config/engines.openrouter-llm.toml.

[s1]
kind            = "jev"
base_url        = "${TLE_S1_URL:-https://openrouter.ai/api/alpha/decisions}"
model           = "${TLE_S1_MODEL:-typesafe/jev-1.14}"
api_key_env     = "OPENROUTER_API_KEY"
batch_size      = 10     # citizens (or options) per request
max_concurrency = 8

[s2]
kind        = "openai_compat"
base_url    = "${TLE_S2_URL:-https://openrouter.ai/api/v1}"
model       = "${TLE_S2_MODEL:-meta-llama/llama-3.1-8b-instruct}"
api_key_env = "OPENROUTER_API_KEY"
max_tokens  = 1024   # cuts a runaway generation (some providers loop under schema-constrained decoding); a retry follows
timeout     = 45
temperature = 0.7
