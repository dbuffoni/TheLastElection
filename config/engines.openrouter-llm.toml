# S1 and S2 both on small open models served by OpenRouter, from environment variables (see .env.example).
# Use: uv run tle run --engines config/engines.openrouter-llm.toml --n 60 --cache runs/cache.jsonl
# For S1 on TypeSafe's Jev decision model (the intended S1), use config/engines.openrouter.toml.

[s1]
kind        = "openai_compat"
base_url    = "${TLE_S1_URL:-https://openrouter.ai/api/v1}"
model       = "${TLE_S1_MODEL:-mistralai/ministral-8b-2512}"
api_key_env = "OPENROUTER_API_KEY"

[s2]
kind        = "openai_compat"
base_url    = "${TLE_S2_URL:-https://openrouter.ai/api/v1}"
model       = "${TLE_S2_MODEL:-meta-llama/llama-3.1-8b-instruct}"
api_key_env = "OPENROUTER_API_KEY"
max_tokens  = 1024   # cuts a runaway generation (some providers loop under schema-constrained decoding); a retry follows
timeout     = 45
temperature = 0.7
