# Settings of the Liquid engine (packages/tle-liquid). Everything is optional; flags of `tle-liquid` and the
# TLE_LIQUID_* environment variables win over this file.
# roles     = ["s1", "s2"]   # a machine with little memory can serve one role (the other runs elsewhere)
# device    = "auto"         # auto | cuda (NVIDIA) | rocm (AMD) | cpu
# dtype     = "auto"         # auto = bf16 on GPU, fp32 on CPU
# host      = "127.0.0.1"    # "0.0.0.0" to serve another machine; then set TLE_LIQUID_API_KEY
# port      = 8100
# max_batch = 16             # requests fused into one GPU call
# max_wait_ms = 15
# lazy_load = false

[s1]   # Liquid d1 decision model (one forward pass, no generation). Smaller: LiquidAI/d1-omni-600M
repo = "LiquidAI/d1-2B"

[s2]   # non-thinking instruct model. Other sizes: LiquidAI/LFM2.5-350M, LiquidAI/LFM2.5-2.6B
repo = "LiquidAI/LFM2.5-1.2B-Instruct"
